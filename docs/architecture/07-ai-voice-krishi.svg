<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="100%" height="100%" style="background:#0b0f19; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <marker id="arrowV7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowB7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowG7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="1050" fill="url(#bgGrad7)"/>

  <!-- Top Header Banner -->
  <rect x="40" y="30" width="1520" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow7)"/>
  <text x="70" y="66" fill="#f8fafc" font-size="22" font-weight="800">DIAGRAM 7: AI, VOICE &amp; KRISHIGPT DECISION-SUPPORT ARCHITECTURE</text>
  <text x="70" y="90" fill="#94a3b8" font-size="13">Grounded Foundation Models: Zero-Hallucination Gemini Grounding • Multilingual Voice Loop • Krishi Agromet Engine</text>
  <rect x="1270" y="48" width="260" height="42" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="1400" y="74" fill="#c4b5fd" font-size="12" font-weight="700" text-anchor="middle">ZERO-HALLUCINATION AI</text>

  <!-- ================= CRITICAL AI MANDATE BANNER ================= -->
  <rect x="40" y="125" width="1520" height="45" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="65" cy="147" r="10" fill="#8b5cf6"/>
  <text x="65" y="152" fill="#ffffff" font-size="13" font-weight="900" text-anchor="middle">★</text>
  <text x="90" y="152" fill="#ede9fe" font-size="13" font-weight="800">ARCHITECTURAL GROUNDING MANDATE:</text>
  <text x="410" y="152" fill="#ddd6fe" font-size="12.5" font-weight="600">The Canonical WeatherSnapshot is the sole truth. Gemini serves exclusively as the Natural Language Explanation and Translation Layer; it NEVER invents or alters meteorological values.</text>

  <!-- ================= 3 SPECIALIZED WORKFLOW PANELS ================= -->

  <!-- WORKFLOW 1: GEMINI GROUNDED CONVERSATION (Left Panel) -->
  <g transform="translate(40, 185)">
    <rect width="480" height="745" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow7)"/>
    <rect width="480" height="38" rx="12" fill="#5b21b6"/>
    <rect y="22" width="480" height="16" fill="#5b21b6"/>
    <text x="20" y="26" fill="#f5f3ff" font-size="13" font-weight="900" letter-spacing="0.5">WORKFLOW 1: GEMINI CONVERSATIONAL AI</text>
    <rect x="360" y="8" width="105" height="24" rx="4" fill="#6d28d9"/>
    <text x="412" y="24" fill="#ede9fe" font-size="9.5" font-weight="800" text-anchor="middle">GROUNDED LLM</text>

    <g transform="translate(20, 52)">
      <!-- Step 1 -->
      <rect width="440" height="68" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="15" y="22" fill="#c7d2fe" font-size="11" font-weight="800">1. User Natural Language Query</text>
      <text x="15" y="38" fill="#e0e7ff" font-size="10.5">Input: "Will it rain heavily in Baramati tomorrow evening?"</text>
      <text x="15" y="54" fill="#a5b4fc" font-size="9.5">Entity extracted: Location="Baramati", Time="Tomorrow evening"</text>

      <line x1="220" y1="68" x2="220" y2="90" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowV7)"/>

      <!-- Step 2 -->
      <rect y="92" width="440" height="85" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="15" y="114" fill="#c7d2fe" font-size="11" font-weight="800">2. Structured Grounding Injection</text>
      <text x="15" y="130" fill="#e0e7ff" font-size="10">System injects deterministic Canonical WeatherSnapshot:</text>
      <text x="15" y="146" fill="#a5b4fc" font-size="9" font-family="monospace">Temp: 28.4°C, RainProb: 78%, RainAmount: 34mm</text>
      <text x="15" y="160" fill="#a5b4fc" font-size="9" font-family="monospace">DWR dBZ: 42 (Approaching), RiverLevel: Warning</text>

      <line x1="220" y1="177" x2="220" y2="199" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowV7)"/>

      <!-- Step 3 -->
      <rect y="201" width="440" height="95" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
      <text x="15" y="223" fill="#f3e8ff" font-size="11" font-weight="800">3. Gemini Zero-Hallucination System Prompt</text>
      <text x="15" y="239" fill="#e9d5ff" font-size="9.5">"You are WeatherGPT meteorologist. You MUST strictly use</text>
      <text x="15" y="253" fill="#e9d5ff" font-size="9.5"> the numbers in the snapshot. Never speculate on rain amounts.</text>
      <text x="15" y="267" fill="#e9d5ff" font-size="9.5"> If data is absent, state that telemetry is not available."</text>
      <text x="15" y="284" fill="#c084fc" font-size="9">Code Ref: <tspan fill="#f5f3ff">GeminiApiService.kt &amp; WeatherDecisionEngine.kt</tspan></text>

      <line x1="220" y1="296" x2="220" y2="318" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowV7)"/>

      <!-- Step 4 -->
      <rect y="320" width="440" height="75" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="15" y="342" fill="#c7d2fe" font-size="11" font-weight="800">4. Gemini Pro / Flash API Execution</text>
      <text x="15" y="358" fill="#e0e7ff" font-size="10">Cloud REST endpoint with streaming token response</text>
      <text x="15" y="374" fill="#a5b4fc" font-size="9.5">Parameters: Temperature = 0.2 (Low variance, factual compliance)</text>

      <line x1="220" y1="395" x2="220" y2="417" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowV7)"/>

      <!-- Step 5 -->
      <rect y="419" width="440" height="85" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="15" y="441" fill="#c7d2fe" font-size="11" font-weight="800">5. Output Verification &amp; Guardrail Filter</text>
      <text x="15" y="457" fill="#e0e7ff" font-size="10">• Scans output text to verify mentioned numbers match snapshot</text>
      <text x="15" y="473" fill="#e0e7ff" font-size="10">• Formats safety recommendations and actionable summary cards</text>
      <text x="15" y="490" fill="#a5b4fc" font-size="9">Rejects response if numeric values diverge from domain snapshot</text>

      <line x1="220" y1="504" x2="220" y2="526" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowV7)"/>

      <!-- Step 6 -->
      <rect y="528" width="440" height="145" rx="8" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/>
      <text x="15" y="550" fill="#ffffff" font-size="12" font-weight="900">OUTPUT: METEOROLOGICALLY ACCURATE EXPLANATION</text>
      <text x="15" y="570" fill="#f5f3ff" font-size="10.5">"In Baramati, expect moderate-to-heavy rain tomorrow</text>
      <text x="15" y="586" fill="#f5f3ff" font-size="10.5"> evening between 4 PM and 8 PM with 78% probability</text>
      <text x="15" y="602" fill="#f5f3ff" font-size="10.5"> (~34mm accumulation). Radar shows incoming storm cells.</text>
      <text x="15" y="622" fill="#a7f3d0" font-size="10.5" font-weight="700">Action: Delay evening pesticide spraying. Secure open crops."</text>
      <text x="15" y="648" fill="#ddd6fe" font-size="9.5">Rendered in Chat UI &amp; Saved to Room Database chat_history</text>
    </g>
  </g>

  <!-- WORKFLOW 2: VOICE AI WORKFLOW (Center Panel) -->
  <g transform="translate(560, 185)">
    <rect width="480" height="745" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow7)"/>
    <rect width="480" height="38" rx="12" fill="#0369a1"/>
    <rect y="22" width="480" height="16" fill="#0369a1"/>
    <text x="20" y="26" fill="#f0f9ff" font-size="13" font-weight="900" letter-spacing="0.5">WORKFLOW 2: MULTILINGUAL VOICE PIPELINE</text>
    <rect x="345" y="8" width="120" height="24" rx="4" fill="#0284c7"/>
    <text x="405" y="24" fill="#e0f2fe" font-size="9.5" font-weight="800" text-anchor="middle">HANDS-FREE VERNACULAR</text>

    <g transform="translate(20, 52)">
      <!-- Step 1 -->
      <rect width="440" height="68" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
      <text x="15" y="22" fill="#bae6fd" font-size="11" font-weight="800">1. Real-Time Audio Capture (Android Mic)</text>
      <text x="15" y="38" fill="#e0f2fe" font-size="10.5">One-touch Push-to-Talk button on Chat/Voice screen</text>
      <text x="15" y="54" fill="#7dd3fc" font-size="9.5">Noise suppression &amp; acoustic echo cancellation enabled</text>

      <line x1="220" y1="68" x2="220" y2="90" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowB7)"/>

      <!-- Step 2 -->
      <rect y="92" width="440" height="85" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
      <text x="15" y="114" fill="#bae6fd" font-size="11" font-weight="800">2. Speech-to-Text (STT) &amp; Language Detection</text>
      <text x="15" y="130" fill="#e0f2fe" font-size="10">Supports 10 Indian Languages:</text>
      <text x="15" y="146" fill="#7dd3fc" font-size="9.5">Hindi, Bengali, Marathi, Tamil, Telugu, Gujarati, Kannada, etc.</text>
      <text x="15" y="162" fill="#38bdf8" font-size="9">Code Ref: <tspan fill="#f0f9ff">VoiceSpeechService.kt &amp; IndianLanguage.kt</tspan></text>

      <line x1="220" y1="177" x2="220" y2="199" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowB7)"/>

      <!-- Step 3 -->
      <rect y="201" width="440" height="95" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="15" y="223" fill="#ffffff" font-size="11" font-weight="800">3. Voice Intent &amp; Entity Resolution</text>
      <text x="15" y="239" fill="#e0f2fe" font-size="9.5">VoiceWeatherIntentEngine parses transcription:</text>
      <text x="15" y="253" fill="#bae6fd" font-size="9.5">• Current Weather • 48h Rain Forecast • Flood Alert</text>
      <text x="15" y="267" fill="#bae6fd" font-size="9.5">• Farmer Spray Window • Radar Status</text>
      <text x="15" y="284" fill="#7dd3fc" font-size="9">Maps query directly to relevant CanonicalWeatherSnapshot fields</text>

      <line x1="220" y1="296" x2="220" y2="318" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowB7)"/>

      <!-- Step 4 -->
      <rect y="320" width="440" height="75" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
      <text x="15" y="342" fill="#bae6fd" font-size="11" font-weight="800">4. Grounded Formulation in Native Language</text>
      <text x="15" y="358" fill="#e0f2fe" font-size="10">Synthesizes short, crisp answer (max 35 words) for audio</text>
      <text x="15" y="374" fill="#7dd3fc" font-size="9.5">Formulates response directly in user's detected mother tongue</text>

      <line x1="220" y1="395" x2="220" y2="417" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowB7)"/>

      <!-- Step 5 -->
      <rect y="419" width="440" height="85" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
      <text x="15" y="441" fill="#bae6fd" font-size="11" font-weight="800">5. Text-to-Speech (Android TTS Engine)</text>
      <text x="15" y="457" fill="#e0f2fe" font-size="10">• Configures native locale (e.g. Locale("hi", "IN") or Locale("mr", "IN"))</text>
      <text x="15" y="473" fill="#e0f2fe" font-size="10">• Fallback to high-quality cloud neural voice if available</text>
      <text x="15" y="490" fill="#7dd3fc" font-size="9">Handles pitch, speech rate, and audio focus ducking</text>

      <line x1="220" y1="504" x2="220" y2="526" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowB7)"/>

      <!-- Step 6 -->
      <rect y="528" width="440" height="145" rx="8" fill="#075985" stroke="#38bdf8" stroke-width="2"/>
      <text x="15" y="550" fill="#ffffff" font-size="12" font-weight="900">OUTPUT: NATURAL VERNACULAR AUDIO PLAYBACK</text>
      <text x="15" y="570" fill="#e0f2fe" font-size="10.5">Example (Hindi): "कल शाम बारामती में 78% बारिश</text>
      <text x="15" y="586" fill="#e0f2fe" font-size="10.5"> की संभावना है। 34 मिमी तक वर्षा हो सकती है।</text>
      <text x="15" y="602" fill="#e0f2fe" font-size="10.5"> कीटनाशक का छिड़काव कल न करें।"</text>
      <text x="15" y="626" fill="#a7f3d0" font-size="10.5" font-weight="700">Audio plays with live visualizer waveform in &lt; 1.8 seconds</text>
      <text x="15" y="648" fill="#bae6fd" font-size="9.5">Crucial for low-literacy farmers and driving operations</text>
    </g>
  </g>

  <!-- WORKFLOW 3: KRISHIGPT AGROMET ENGINE (Right Panel) -->
  <g transform="translate(1080, 185)">
    <rect width="480" height="745" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow7)"/>
    <rect width="480" height="38" rx="12" fill="#065f46"/>
    <rect y="22" width="480" height="16" fill="#065f46"/>
    <text x="20" y="26" fill="#ecfdf5" font-size="13" font-weight="900" letter-spacing="0.5">WORKFLOW 3: KRISHIGPT AGROMET ADVISORY</text>
    <rect x="360" y="8" width="105" height="24" rx="4" fill="#047857"/>
    <text x="412" y="24" fill="#a7f3d0" font-size="9.5" font-weight="800" text-anchor="middle">FARM INTELLIGENCE</text>

    <g transform="translate(20, 52)">
      <!-- Step 1 -->
      <rect width="440" height="68" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="22" fill="#a7f3d0" font-size="11" font-weight="800">1. Farmer Agricultural Profile Inputs</text>
      <text x="15" y="38" fill="#ecfdf5" font-size="10.5">• Crop Type: Paddy, Wheat, Cotton, Mustard, Sugarcane, Soy</text>
      <text x="15" y="54" fill="#6ee7b7" font-size="9.5">• Growth Stage: Sowing, Vegetative, Flowering, Grain-fill, Harvest</text>

      <line x1="220" y1="68" x2="220" y2="90" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG7)"/>

      <!-- Step 2 -->
      <rect y="92" width="440" height="85" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="114" fill="#a7f3d0" font-size="11" font-weight="800">2. Soil &amp; Field Moisture Context</text>
      <text x="15" y="130" fill="#ecfdf5" font-size="10">• Soil texture: Black cotton, Alluvial, Red sandy loam</text>
      <text x="15" y="146" fill="#6ee7b7" font-size="9.5">• Antecedent Rainfall: Past 3-day precipitation accumulation</text>
      <text x="15" y="162" fill="#6ee7b7" font-size="9.5">• Current soil drainage capacity and ponding status</text>

      <line x1="220" y1="177" x2="220" y2="199" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG7)"/>

      <!-- Step 3 -->
      <rect y="201" width="440" height="95" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
      <text x="15" y="223" fill="#ffffff" font-size="11" font-weight="800">3. KrishiGPT Algorithmic Decision Engine</text>
      <text x="15" y="239" fill="#ecfdf5" font-size="9.5">Deterministic rule-base in <tspan fill="#a7f3d0">KrishiGptEngine.kt</tspan>:</text>
      <text x="15" y="253" fill="#bbf7d0" font-size="9.5">• Spray Window Logic: RainProb &lt; 30% AND Wind &lt; 15 km/h</text>
      <text x="15" y="267" fill="#bbf7d0" font-size="9.5">• Irrigation Logic: If Rain &gt; 25mm within 48h → SKIP irrigation</text>
      <text x="15" y="284" fill="#6ee7b7" font-size="9">• Pest Alert: RH &gt; 85% + Temp 24–30°C → High Fungal Risk</text>

      <line x1="220" y1="296" x2="220" y2="318" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG7)"/>

      <!-- Step 4 -->
      <rect y="320" width="440" height="75" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="342" fill="#a7f3d0" font-size="11" font-weight="800">4. LLM Agromet Contextualization</text>
      <text x="15" y="358" fill="#ecfdf5" font-size="10">Translates technical rules into farmer-friendly actionable steps</text>
      <text x="15" y="374" fill="#6ee7b7" font-size="9.5">Integrates Indian Council of Agricultural Research (ICAR) guidelines</text>

      <line x1="220" y1="395" x2="220" y2="417" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG7)"/>

      <!-- Step 5 -->
      <rect y="419" width="440" height="85" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="441" fill="#a7f3d0" font-size="11" font-weight="800">5. Crop Calendar &amp; Hazard Gating</text>
      <text x="15" y="457" fill="#ecfdf5" font-size="10">• Heat stress alert if max temperature &gt; 38°C at flowering</text>
      <text x="15" y="473" fill="#ecfdf5" font-size="10">• Heavy rain / lodging warning for mature crops awaiting harvest</text>
      <text x="15" y="490" fill="#6ee7b7" font-size="9">Generates color-coded advisory card for KrishiScreen</text>

      <line x1="220" y1="504" x2="220" y2="526" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG7)"/>

      <!-- Step 6 -->
      <rect y="528" width="440" height="145" rx="8" fill="#047857" stroke="#4ade80" stroke-width="2"/>
      <text x="15" y="550" fill="#ffffff" font-size="12" font-weight="900">OUTPUT: ACTIONABLE AGROMET ADVISORY</text>
      <text x="15" y="570" fill="#ecfdf5" font-size="10.5">✓ SPRAY WINDOW: UNSAFE (Rain onset within 4h)</text>
      <text x="15" y="586" fill="#ecfdf5" font-size="10.5">✓ IRRIGATION: POSTPONE (34mm rain expected)</text>
      <text x="15" y="602" fill="#ecfdf5" font-size="10.5">✓ PEST ADVISORY: Brown Plant Hopper risk high</text>
      <text x="15" y="626" fill="#fef08a" font-size="10.5" font-weight="700">Financial Impact: Prevents chemical runoff &amp; cuts power bills</text>
      <text x="15" y="648" fill="#a7f3d0" font-size="9.5">Delivered via Krishi Tab &amp; Localized Voice Assistant</text>
    </g>
  </g>

  <!-- ================= FOOTER ================= -->
  <g transform="translate(40, 995)">
    <line x1="0" y1="0" x2="1520" y2="0" stroke="#334155" stroke-width="1"/>
    <text x="0" y="25" fill="#38bdf8" font-size="12" font-weight="800">WeatherGPT | SIH 2026 | PS-68 | Ministry of Earth Sciences</text>
    <text x="760" y="25" fill="#facc15" font-size="12" font-weight="700" text-anchor="middle">Data → Intelligence → Forecast → Risk → Action</text>
    <text x="1520" y="25" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="end">Production Implementation • Zero-Hallucination Architecture</text>
